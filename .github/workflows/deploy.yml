name: Deploy Hexo Blog

on:
  push:
    branches: [source]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 0

      - name: Restore file modification times
        run: |
          # Hexo 的 updated_option 是 mtime，而 checkout 会把所有文件的修改时间
          # 设成同一时刻 —— 于是每篇文章的「更新于」都变成构建时间。
          # 这里按每个文件最后一次提交的时间把它还原回去。
          #
          # ⚠️ 必须用 `-z` + `read -d ''` 读路径：非 ASCII 文件名在 git 的默认输出里
          # 会被转义成 "\343\200\220..." 并加上引号，直接当路径用会找不到文件。
          # 上一版就是这么空转的 —— 判断 `^source/_posts/` 永远不匹配，touch 全部跳过。
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              source/_posts/*.md)
                ts=$(git log -1 --format='%aI' -- "$file" 2>/dev/null || true)
                if [ -n "$ts" ]; then touch -d "$ts" "$file"; fi
                ;;
            esac
          done
          echo "还原后的修改时间（应与各文最后一次提交一致）："
          ls -l --time-style=long-iso source/_posts/*.md

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate static files
        run: |
          rm -f node_modules/hexo-theme-butterfly/source/img/favicon.ico
          python3 scripts/patch-lang.py
          npx hexo generate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: main
